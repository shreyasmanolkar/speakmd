[project]
name = "speakmd"
version = "0.1.0"
description = "A local, resumable Markdown-to-speech application"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "markdown-it-py>=3.0,<5",
  "mdit-py-plugins>=0.4,<1",
  "kokoro>=0.9.4",
  "psutil>=5.9,<8",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
speakmd = "speakmd.app:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
